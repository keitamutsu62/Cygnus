name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - services/loop/frontend/**
      - services/studio/frontend/**
      - .github/workflows/deploy-frontend.yml

env:
  AWS_REGION: ap-northeast-1

jobs:
  # ─── LOOP ─────────────────────────────────────────────────────
  deploy-loop:
    name: Deploy LOOP Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/loop/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install deps (root workspace)
        run: npm ci
        working-directory: .

      - run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        run: aws s3 sync dist s3://cygnus-loop-frontend --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E2AV5TA9PJA0VR \
            --paths "/*"

  # ─── STUDIO ───────────────────────────────────────────────────
  deploy-studio:
    name: Deploy STUDIO Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/studio/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install deps (root workspace)
        run: npm ci
        working-directory: .

      - run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        run: aws s3 sync dist s3://cygnus-studio-frontend --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E3GYCGERB2N9OO \
            --paths "/*"
